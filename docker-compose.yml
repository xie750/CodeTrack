services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: codetrack
      POSTGRES_USER: codetrack
      POSTGRES_PASSWORD: codetrack
    volumes:
      - codetrack_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codetrack -d codetrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app_net

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - codetrack_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app_net

  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/codetrack-knowledge || true
      "
    networks:
      - app_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      CODETRACK_DATABASE_URL: postgresql+psycopg2://codetrack:codetrack@postgres:5432/codetrack
      CODETRACK_REDIS_URL: redis://redis:6379/0
      CODETRACK_S3_ENDPOINT: http://minio:9000
      CODETRACK_S3_ACCESS_KEY: minioadmin
      CODETRACK_S3_SECRET_KEY: minioadmin
      CODETRACK_S3_BUCKET: codetrack-knowledge
      CODETRACK_S3_SECURE: "false"
      CODETRACK_RAG_STORAGE_BACKEND: s3
      CODETRACK_EMBEDDING_PROVIDER: bge_m3
      CODETRACK_EMBEDDING_MODEL: BAAI/bge-m3
      CODETRACK_EMBEDDING_DIM: "1024"
      CODETRACK_RERANK_PROVIDER: bge
      CODETRACK_RERANK_MODEL: BAAI/bge-reranker-v2-m3
      CODETRACK_DEMO_USER_ID: user_student_001
      CODETRACK_AUTH_SECRET_KEY: codetrack-demo-secret-change-me
      CODETRACK_SANDBOX_SERVICE_URL: http://sandbox:8011
      CODETRACK_PISTON_BASE_URL: http://piston:2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      sandbox:
        condition: service_started
      piston:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - app_net

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A backend.app.workers.celery_app.celery_app worker --loglevel=INFO
    environment:
      CODETRACK_DATABASE_URL: postgresql+psycopg2://codetrack:codetrack@postgres:5432/codetrack
      CODETRACK_REDIS_URL: redis://redis:6379/0
      CODETRACK_S3_ENDPOINT: http://minio:9000
      CODETRACK_S3_ACCESS_KEY: minioadmin
      CODETRACK_S3_SECRET_KEY: minioadmin
      CODETRACK_S3_BUCKET: codetrack-knowledge
      CODETRACK_S3_SECURE: "false"
      CODETRACK_RAG_STORAGE_BACKEND: s3
      CODETRACK_EMBEDDING_PROVIDER: bge_m3
      CODETRACK_EMBEDDING_MODEL: BAAI/bge-m3
      CODETRACK_EMBEDDING_DIM: "1024"
      CODETRACK_RERANK_PROVIDER: bge
      CODETRACK_RERANK_MODEL: BAAI/bge-reranker-v2-m3
      CODETRACK_AUTH_SECRET_KEY: codetrack-demo-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - app_net

  sandbox:
    image: codetrack-sandbox-runner:0.1
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    environment:
      CODETRACK_SANDBOX_EXECUTION_MODE: docker
      CODETRACK_SANDBOX_RUNNER_IMAGE: codetrack-sandbox-runner:0.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    networks:
      - app_net

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec
    networks:
      - app_net

volumes:
  codetrack_pg:
  codetrack_minio:
  piston_packages:

networks:
  app_net:
